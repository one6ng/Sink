name: Deploy Sink to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sink-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_D1_DATABASE_ID: ${{ secrets.DEPLOY_D1_DATABASE_ID }}
      DEPLOY_KV_NAMESPACE_ID: ${{ secrets.DEPLOY_KV_NAMESPACE_ID }}
      DEPLOY_D1_DATABASE_NAME: ${{ secrets.DEPLOY_D1_DATABASE_NAME }}
      DEPLOY_KV_PREVIEW_NAMESPACE_ID: ${{ secrets.DEPLOY_KV_PREVIEW_NAMESPACE_ID }}
      DEPLOY_ANALYTICS_DATASET: ${{ secrets.DEPLOY_ANALYTICS_DATASET }}
      DEPLOY_R2_BUCKET_NAME: ${{ secrets.DEPLOY_R2_BUCKET_NAME }}
      DEPLOY_R2_PREVIEW_BUCKET_NAME: ${{ secrets.DEPLOY_R2_PREVIEW_BUCKET_NAME }}
      
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations and deploy
        run: pnpm deploy:worker
